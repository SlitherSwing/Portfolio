<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mon CV</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="Container">
        <div class="One"> <!-- photo de profil -->
            <div class="Bloc-1">
                <img class="Bloc-1-Img" src="assets/librairies/Moi.webp" alt="Photo de profil">
                <div class="Bloc-1-Text">
                    <h2>Kevin Mascaro</h2>
                    <p>Développeur Full-Stack Jr</p>
                </div>
            </div>
        </div>


        <!-- Timeline des apprentissages-->
        <div class="Two">
            <div class="Bloc-2-Timeline">
                <div class="Timeline-Container Left">
                    <div class="Timeline-Content">
                        <p>Septembre 2025 : </p>
                        <p>Apprentissage HTML/CSS</p>
                        <p>Apprentissage C#/SQL</p>
                    </div>
                </div>
                <div class="Timeline-Container Right">
                    <div class="Timeline-Content">
                        <p>Décembre 2025 : </p>
                        <p>Découverte JavaScript</p>
                        <p>Veille sur Git et GitHub</p>
                    </div>
                </div>
                <div class="Timeline-Container Left">
                    <div class="Timeline-Content">
                        <p>Janvier 2026 : </p>
                        <p>Apprentissage PHP</p>
                        <p>Apprentissage Git</p>
                    </div>
                </div>
                <div class="Timeline-Container Right">
                    <div class="Timeline-Content">
                        <p>A venir : </p>
                        <p>Apprentissage de Python</p>
                    </div>
                </div>
            </div>
        </div>


        <!-- Réalisations, différents projets-->
        <div class="Three">
            <div class="Bloc-3-Container">
                <div class="Bloc-3-Projet-Container"><a href="Produit.html"><img class="Bloc-3-Img"
                            src="assets/librairies/Projet_3.png" alt=""></a></div>
                <div class="Bloc-3-Projet-Container"><a href="pageweb.html"><img class="Bloc-3-Img"
                            src="assets/librairies/Projet_Integration.png" alt=""></a></div>
                <div class="Bloc-3-Projet-Container"><a href="AJ.html"><img class="Bloc-3-Img"
                            src="assets/librairies/Projet_CV.png" alt=""></a></div>
            </div>
        </div>



        <!-- Brève présentation -->
        <div class="Four">
            <p>4</p>
        </div>



        <div class="Links-Wrapper">
            <!-- CV Button -->
            <div class="Five">
                <button class="Bloc-5-Button">
                    <img class="Bloc-5-Icone" src="assets/librairies/download.svg" alt="">
                    <a href="assets/CV_Kevin_Mascaro.pdf"><span class="Bloc-5-Text">Lien pour
                            télécharger le CV</span></a>
                </button>
            </div>
            <!-- LinkedIn Button -->
            <div class="Six">
                <button class="Bloc-5-Button">
                    <img class="Bloc-5-Icone" src="assets/librairies/linkedin.svg" alt="">
                    <a href="www.linkedin.com/in/kevin-mascaro-dev-full-stack-junior"><span class="Bloc-5-Text">Lien
                            vers ma page LinkedIn</span></a>
                </button>
            </div>
            <!-- Mail Button -->
            <div class="Seven">
                <button class="Bloc-5-Button">
                    <img class="Bloc-5-Icone" src="assets/librairies/mail.svg" alt="">
                    <span class="Bloc-5-Text">kevin.lf.mascaro@gmail.com</span>
                </button>
            </div>
        </div>
    </div>
</body>
