<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Contact</title>
    <link href="./assets/css/style.css" rel="stylesheet">
</head>

<body class="bg-[#0b0b1a] text-white font-sans selection:bg-purple-500/30 overflow-x-hidden">

    <!-- Background Sophistication -->
    <div class="fixed inset-0 -z-10 bg-[#0b0b1a]">
        <!-- Mesh Gradient Blobs -->
        <div
            class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-purple-600/20 blur-[120px] rounded-full animate-pulse">
        </div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-indigo-600/20 blur-[120px] rounded-full">
        </div>
        <div
            class="absolute top-[30%] right-[10%] w-[30%] h-[30%] bg-fuchsia-600/10 blur-[100px] rounded-full animate-bounce [animation-duration:10s]">
        </div>

        <!-- Grid Pattern -->
        <div class="absolute inset-0 opacity-[0.03] pointer-events-none"
            style="background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 50px 50px;">
        </div>
    </div>

    <div class="relative w-full p-10 min-h-screen">
        <nav class="flex justify-between items-center text-gray-300 mb-20 relative z-10">
            <span
                class="font-bold text-xl tracking-tight bg-clip-text text-transparent bg-linear-to-r from-purple-400 to-indigo-400">Kevin
                Mascaro</span>
            <ul class="flex gap-8 font-medium">
                <li class="hover:text-purple-400 transition-colors cursor-pointer"><a href="./index.html">Accueil</a>
                </li>
                <li class="text-purple-400 cursor-default"><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>

        <!-- Contact Section -->
        <div class="flex flex-col justify-center items-center mt-20 relative z-10">
            <div class="text-center mb-12">
                <h3 class="font-bold text-6xl mb-4 italic tracking-tighter">
                    <span class="overline decoration-purple-500 decoration-[6px] underline-offset-8">Con</span>tact
                </h3>
                <p class="text-gray-400 font-medium">Discutons de votre prochain projet</p>
            </div>

            <!-- Glass Container -->
            <div
                class="w-full max-w-xl p-px rounded-2xl bg-linear-to-br from-white/20 to-transparent shadow-[0_0_50px_-12px_rgba(168,85,247,0.4)]">
                <div class="bg-black/40 backdrop-blur-2xl rounded-2xl p-10 flex flex-col items-center">
                    <form action="https://formsubmit.co/kevin.lf.mascaro@gmail.com" method="POST"
                        class="w-full flex flex-col gap-6">

                        <div class="group flex flex-col gap-2">
                            <label class="text-xs font-bold uppercase tracking-widest text-purple-400 ml-1">Nom</label>
                            <input type="text" name="name" placeholder="Votre nom" required
                                class="w-full p-4 text-white bg-white/5 border border-white/10 rounded-xl outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all duration-300 placeholder:text-gray-600">
                        </div>

                        <div class="group flex flex-col gap-2">
                            <label
                                class="text-xs font-bold uppercase tracking-widest text-purple-400 ml-1">Email</label>
                            <input type="email" name="email" placeholder="votre@email.com" required
                                class="w-full p-4 text-white bg-white/5 border border-white/10 rounded-xl outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all duration-300 placeholder:text-gray-600">
                        </div>

                        <div class="group flex flex-col gap-2">
                            <label
                                class="text-xs font-bold uppercase tracking-widest text-purple-400 ml-1">Message</label>
                            <textarea name="message" rows="4" placeholder="Bonjour, je souhaiterais..." required
                                class="w-full p-4 text-white bg-white/5 border border-white/10 rounded-xl outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all duration-300 resize-none placeholder:text-gray-600"></textarea>
                        </div>

                        <button type="submit"
                            class="mt-4 w-full p-4 font-bold text-white bg-linear-to-r from-purple-600 to-indigo-600 rounded-xl shadow-lg shadow-purple-900/20 hover:shadow-purple-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 cursor-pointer">
                            Envoyer le message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
